<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="contact us page. Give us any feedback or suggestions, or just to chat with us!">
    <meta name="author" content="Devin Hale">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us</title>
</head>
<body>
    <header>
        <img src="images/z-boat-splash.png" alt="white water raft logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <h1>White Water Rafting Co.</h1>
            <ul>
                <li>50 East North Temple St</li>
                <li>Salt Lake City, Ut</li>
                <li>1 123 456 7890</li>
                <li>example@wwr.org</li>
            </ul>
        </section>
        <section class="mid">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d755.3984208862756!2d-111.88969909398945!3d40.77096057529391!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8752f507c72c8039%3A0xe67a34043a62cb5e!2sChurch%20Office%20Building%20-%20The%20Church%20of%20Jesus%20Christ%20of%20Latter-day%20Saints!5e0!3m2!1sen!2sus!4v1781370754132!5m2!1sen!2sus" width="300" height="225" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            <form>
                <label for="fullname">Name</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="useremail">Email</label>
                <input type="email" id="useremail" name="useremail" required>

                <label>Message Purpose</label>

                <div class="radio-group">
                    <label><input type="radio" name="message-type"> General Inquiry</label>
                    <label><input type="radio" name="message-type"> Reservation Question</label>
                    <label><input type="radio" name="message-type"> Website Suggestion</label>
                </div>

                <label for="message">Message</label>
                <textarea name="message" id="message" rows="4" placeholder="Type here"></textarea>

                <div class="newsletter">
                    <label><input type="checkbox" name="subscribe"> Please Subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <div class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure><img src="images/Josh.jpg" alt="Josh"><figcaption>Josh (Safety Instructor)</figcaption></figure>

            <figure><img src="images/Mary.jpg" alt="Mary"><figcaption>Mary (Tour Guide)</figcaption></figure>

            <figure><img src="images/Sarah.jpg" alt="Sarah"><figcaption>Sarah (Tour Assistant)</figcaption></figure>
        </div>
    
    
    </main>
    <footer>
        <p>&copy; 2026 | White Water Rafting | Devin Hale</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>
</html>
